services:
  eligibility-criteria:
    image: eligibility-criteria-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eligibility-criteria-backend-app
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    ports:
      - "5000:5000"
    restart: unless-stopped
